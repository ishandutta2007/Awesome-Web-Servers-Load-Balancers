<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes dashFlow {
        from {
          stroke-dashoffset: 100;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes pulseGlow {
        0%, 100% {
          opacity: 0.35;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.08);
        }
      }

      @keyframes floatCard {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes floatCardAlt {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(7px);
        }
      }

      @keyframes packetTravel {
        0% {
          offset-distance: 0%;
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          offset-distance: 100%;
          opacity: 0;
        }
      }

      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 2.5s linear infinite;
      }

      .pulse-circle {
        transform-origin: center;
        animation: pulseGlow 3s ease-in-out infinite;
      }

      .floating-node-1 {
        animation: floatCard 6s ease-in-out infinite;
      }

      .floating-node-2 {
        animation: floatCardAlt 5s ease-in-out infinite;
      }

      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Subtle Radial Background Accents -->
  <circle cx="200" cy="90" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glowCyan)" />
  <circle cx="1020" cy="330" r="160" fill="#8b5cf6" opacity="0.1" filter="url(#glowCyan)" />
  <circle cx="600" cy="380" r="200" fill="#3b82f6" opacity="0.08" />

  <!-- DYNAMIC ANIMATED ARCHITECTURE / TRAFFIC FLOW (Background layer) -->
  <g opacity="0.55">
    <!-- Connecting Load Balancer Path lines -->
    <!-- Incoming traffic line to Load Balancer -->
    <path d="M 120 340 L 320 340" fill="none" stroke="url(#accentCyan)" stroke-width="2.5" class="flow-line" />
    
    <!-- Distribution lines from LB Hub to backend nodes -->
    <path d="M 370 340 C 440 340, 480 290, 560 290" fill="none" stroke="#3b82f6" stroke-width="2" class="flow-line" />
    <path d="M 370 340 L 560 340" fill="none" stroke="#06b6d4" stroke-width="2" class="flow-line" />
    <path d="M 370 340 C 440 340, 480 390, 560 390" fill="none" stroke="#10b981" stroke-width="2" class="flow-line" />

    <!-- Node 1: Client Ingress -->
    <g class="floating-node-1" transform="translate(100, 320)">
      <rect width="40" height="40" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="20" y="25" text-anchor="middle" fill="#06b6d4" font-size="14" font-family="sans-serif">⚡</text>
    </g>

    <!-- Node 2: Central Load Balancer Hub -->
    <g transform="translate(320, 315)">
      <circle cx="25" cy="25" r="32" fill="#0f172a" stroke="url(#accentCyan)" stroke-width="2.5" />
      <circle cx="25" cy="25" r="40" fill="none" stroke="#06b6d4" stroke-width="1" class="pulse-circle" opacity="0.5" />
      <text x="25" y="31" text-anchor="middle" fill="#38bdf8" font-size="20">⚖️</text>
    </g>

    <!-- Node 3, 4, 5: Backend Servers -->
    <g class="floating-node-1" transform="translate(560, 275)">
      <rect width="65" height="30" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <circle cx="12" cy="15" r="4" fill="#10b981" filter="url(#glowGreen)" />
      <text x="38" y="19" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">SRV-01</text>
    </g>

    <g class="floating-node-2" transform="translate(560, 325)">
      <rect width="65" height="30" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="12" cy="15" r="4" fill="#10b981" filter="url(#glowGreen)" />
      <text x="38" y="19" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">SRV-02</text>
    </g>

    <g class="floating-node-1" transform="translate(560, 375)">
      <rect width="65" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="12" cy="15" r="4" fill="#10b981" filter="url(#glowGreen)" />
      <text x="38" y="19" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">SRV-03</text>
    </g>

    <!-- Floating Feature Badges / Pills in Background Right -->
    <g class="floating-node-1" transform="translate(930, 60)">
      <rect width="180" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="20" cy="18" r="5" fill="#38bdf8" />
      <text x="100" y="23" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="600">L4 / L7 Balancing</text>
    </g>

    <g class="floating-node-2" transform="translate(970, 115)">
      <rect width="170" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#10b981" stroke-width="1.2" />
      <circle cx="20" cy="18" r="5" fill="#10b981" />
      <text x="95" y="23" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="600">High Availability</text>
    </g>

    <g class="floating-node-1" transform="translate(910, 170)">
      <rect width="195" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#8b5cf6" stroke-width="1.2" />
      <circle cx="20" cy="18" r="5" fill="#a78bfa" />
      <text x="108" y="23" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="600">TLS/SSL Termination</text>
    </g>
  </g>

  <!-- FOREGROUND BRANDING & TITLE SECTION (Guaranteed non-obstructed) -->
  <g transform="translate(80, 70)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="270" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="140" y="18" text-anchor="middle" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="700" letter-spacing="1">CURATED INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-size="44" class="banner-title">
      Awesome Web Servers
    </text>
    <text x="0" y="130" fill="url(#accentCyan)" font-size="44" class="banner-title">
      &amp; Load Balancers
    </text>

    <!-- Subtitle -->
    <text x="0" y="174" fill="#94a3b8" font-size="17" class="banner-sub">
      A curated ecosystem of high-performance reverse proxies, L4/L7 traffic routers,
    </text>
    <text x="0" y="198" fill="#94a3b8" font-size="17" class="banner-sub">
      ingress controllers, and enterprise Application Delivery Controllers (ADCs).
    </text>

    <!-- Tech Tags Bar -->
    <g transform="translate(0, 222)">
      <text x="0" y="12" fill="#cbd5e1" font-size="13" font-family="monospace">
        ⚡ NGINX · HAPROXY · ENVOY · TRAEFIK · CADDY · PINGORA · AWS ELB · CLOUDFLARE
      </text>
    </g>
  </g>

  <!-- Border Outline -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
</svg>
